<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trainingscentrum Horse Nation</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐎</text></svg>">
<meta name="description" content="Trainingscentrum voor Horse Nation: kosten, klikjes, wedstrijden, fokbonus en planning per paard.">
<meta name="theme-color" content="#2E5E45">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EEE7;--surface:#F8FAF6;--ink:#1A2A21;--muted:#56695D;--line:#C9D3C8;--accent:#2E5E45;--accent-ink:#F4F8F2;
  --brass:#9C7418;--eng:#6E3B87;--spr:#2A5CAA;--west:#A95A1B;--pos:#2E6B3F;--neg:#A3322A;--soft:#DDE5DA;
  --serif:"Bitter",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101713;--surface:#17211B;--ink:#E3EAE3;--muted:#98A99E;--line:#2B3A31;--accent:#7FBF98;--accent-ink:#0F1A13;
  --brass:#D7B25A;--eng:#C79BDB;--spr:#8DB3F0;--west:#E3A36A;--pos:#8FD0A2;--neg:#F0968D;--soft:#223029;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101713;--surface:#17211B;--ink:#E3EAE3;--muted:#98A99E;--line:#2B3A31;--accent:#7FBF98;--accent-ink:#0F1A13;
  --brass:#D7B25A;--eng:#C79BDB;--spr:#8DB3F0;--west:#E3A36A;--pos:#8FD0A2;--neg:#F0968D;--soft:#223029;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:28px clamp(14px,4vw,32px) 64px}
header h1{font:700 clamp(30px,5vw,46px)/1.05 var(--serif);margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:60ch}
h2{font:600 22px/1.25 var(--serif);margin:34px 0 10px}
h3{font:600 17px/1.3 var(--serif);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
small{color:var(--muted);font-size:12px;display:block;font-weight:400}
b{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.picker{margin-top:26px}
.picker h2{margin:0 0 10px;font-size:17px}
#methods{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.mbtn{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;transition:background .15s,border-color .15s}
.mbtn .mn{font-weight:600}.mbtn .ms{font-size:12px;color:var(--muted)}
.mbtn:hover{border-color:var(--accent)}
.mbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mbtn.on .ms{color:inherit;opacity:.8}

#builder{margin-top:18px}
#builder h2{margin:0 0 6px;font-size:19px}
.crow{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;align-items:center}
.chip{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:4px 9px;font-size:13px;font-weight:600}
.chip.les{background:var(--brass);color:var(--surface)}
.chip span{opacity:.75;margin-left:3px}
.clr{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px 6px}
.status{font-size:13px;margin-top:6px}
.warn{color:var(--neg)}.okt{color:var(--pos)}.muted2{color:var(--muted)}
.adds{display:flex;flex-wrap:wrap;gap:4px;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line)}
.adds button{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px}
.adds button.les{border-color:color-mix(in srgb,var(--brass) 50%,var(--line))}
.adds button.rare{opacity:.5;border-style:dashed}
.adds button:hover{border-color:var(--accent)}
.track .bs.les{background:var(--brass)}
.sdg{display:inline-flex;flex-direction:column;gap:3px;vertical-align:middle}
.sl{display:flex;align-items:center;gap:3px}
.sl b{font-size:11px;width:12px;color:var(--muted);font-weight:600}
.sl i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--brass);display:inline-block}
.sl i.f{background:var(--brass)}
table.fb td,table.fb th{vertical-align:middle}
table.fb th[scope=row]{line-height:1.7}
tr.dim>*{opacity:.55}
tr.dim th small{opacity:1}
.bctop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.bctop h2{margin:0}
.tgl{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13.5px}
.tgl:hover{border-color:var(--accent)}
.bclosed{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.csum{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px 18px}
.csum dt{font-size:12.5px;color:var(--muted)}
.csum dd{margin:0;font-weight:600}
table.best th[scope=row]{color:var(--muted);font-weight:600;width:130px}
table.best .lft{text-align:left}
table.best td.lft small{display:block;margin:0}
.how{display:block;font-size:12.5px;color:var(--muted);white-space:normal;max-width:52ch;margin-top:3px;line-height:1.45}
.tag{display:inline-block;margin-bottom:2px;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--ink);margin-right:4px}
.tag.own{background:var(--brass);color:var(--surface)}
.verdict{margin:6px 0 4px;max-width:75ch}
.order{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:4px;max-width:340px;counter-reset:o}
.order li{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 10px;counter-increment:o}
.order li>span:first-child::before{content:counter(o) ".";color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.order button{background:none;border:1px solid var(--line);border-radius:5px;width:28px;height:26px;margin-left:4px;font-size:11px}
.order button:disabled{opacity:.3;cursor:default}
table.plan td{vertical-align:top}
.tl{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;overflow-x:auto}
.tlaxis{position:relative;height:18px;margin-left:150px;margin-right:70px;font-size:11px;color:var(--muted)}
.tlaxis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.tlaxis span:first-child{transform:none}
.tlrow{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:0;margin-top:6px;min-width:560px}
.tln{font-size:13.5px;font-weight:500;white-space:nowrap}
.tltrack{position:relative;height:24px;background:var(--soft);border-radius:5px;overflow:hidden}
.tlseg{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;color:var(--surface);overflow:hidden;white-space:nowrap}
.tlseg.eng.s0{background:var(--eng)}.tlseg.eng.s1{background:color-mix(in srgb,var(--eng) 70%,var(--surface))}
.tlseg.west.s0{background:var(--west)}.tlseg.west.s1{background:color-mix(in srgb,var(--west) 70%,var(--surface))}
.tlend{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);margin-left:-1px}
.tldone{font-size:12.5px;text-align:right;color:var(--muted);white-space:nowrap}
.rpd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:14px 0 4px}
.rpd small{flex-basis:100%;margin-top:-2px}
.rpd>span{font-weight:500}
.rpd .seg{margin:0}
.phase{display:flex;height:46px;border-radius:8px;overflow:hidden;margin-top:10px}
.ph{display:flex;flex-direction:column;justify-content:center;padding:0 10px;color:var(--surface);overflow:hidden;white-space:nowrap;min-width:0}
.ph b{font-size:13px}.ph small{color:inherit;opacity:.85;font-size:11.5px}
.g1{background:color-mix(in srgb,var(--west) 55%,var(--brass))}.g2{background:var(--west)}.g3{background:color-mix(in srgb,var(--west) 50%,var(--eng))}.g4{background:var(--eng)}.g5{background:var(--muted)}
.ph.g1,.ph.g2,.ph.g3,.ph.g4{color:var(--surface)}
.gnum.g1{background:color-mix(in srgb,var(--west) 55%,var(--brass))}.gnum.g2{background:var(--west)}.gnum.g3{background:color-mix(in srgb,var(--west) 50%,var(--eng))}.gnum.g4{background:var(--eng)}.gnum.g5{background:var(--muted)}
.gnum.g1,.gnum.g2,.gnum.g3,.gnum.g4,.gnum.g5{color:var(--surface)}
table.sgt thead th{text-align:left}
table.sgt td:nth-child(5),table.sgt td:nth-child(6),table.sgt td:nth-child(7){white-space:nowrap}
table.sgt td{text-align:left;white-space:normal}
table.sgt th[scope=row]{white-space:nowrap}
table.sgt tr.cur>*{background:color-mix(in srgb,var(--brass) 14%,var(--surface))}
.phaxis{position:relative;height:20px;font-size:11.5px;color:var(--muted);margin-bottom:10px}
.phaxis span{position:absolute;top:3px;transform:translateX(-50%);white-space:nowrap}
.phaxis span:first-child{transform:none;left:0}.phaxis span:last-child{transform:translateX(-100%)}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:8px}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.grp h3{margin:0 0 6px}
.grp p{margin:6px 0;max-width:60ch}
.gnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);font:600 13px var(--sans)}
.gfacts{margin:8px 0;display:flex;flex-direction:column;gap:6px}
.gfacts dt{font-size:12.5px;color:var(--muted)}.gfacts dd{margin:0}
.tip{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.mine{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:8px;padding:10px 14px;max-width:75ch}
td.lft{text-align:left;white-space:normal}
table.lagen td.lc{text-align:left;vertical-align:top}
table.lagen td.lc b{display:block}
table.lagen td.lc .pills{margin:3px 0 2px}
table.lagen td.lc .pill{background:var(--brass);border-color:var(--brass)}
table.lagen td.topl{opacity:.5}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px;margin:12px 0}
.rules>div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:13.5px}
.rules span{color:var(--muted)}
.pls{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-bottom:6px}
.plf .fld{grid-template-columns:1fr 80px}
#summary{margin-top:22px;border-top:3px solid var(--ink);padding-top:14px}
.lead{margin:0 0 10px;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:4px 26px}
.big>div{display:flex;flex-direction:column;padding:6px 0}
.big .num{font:700 clamp(26px,4vw,36px)/1.1 var(--serif);letter-spacing:-.01em}
.big .lab{color:var(--muted);font-size:13px}
.net{margin:12px 0 0}
.pos{color:var(--pos)}.neg{color:var(--neg)}

#tabs{display:flex;gap:2px;margin-top:30px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;white-space:nowrap;color:var(--muted);font-weight:500}
#tabs button.on{color:var(--ink);border-bottom-color:var(--brass)}
#tabs button:hover{color:var(--ink)}

.intro{color:var(--muted);max-width:72ch;margin:0 0 14px}
.note{color:var(--muted);font-size:13px;max-width:72ch}
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
table.narrow{width:auto;min-width:min(100%,460px)}
th,td{padding:9px 11px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
th[scope=row],thead th:first-child{text-align:left}
thead th{font-weight:600;font-size:12.5px;color:var(--muted);background:var(--soft)}
tbody tr:last-child>*{border-bottom:0}
tr.sum>*{background:var(--soft);font-weight:600}
td small{display:inline;margin-left:4px}
td small.blk{display:block;margin:0}
.muted{color:var(--muted);text-align:left}
.ok{color:var(--pos);text-align:left;font-weight:600}
td.best{box-shadow:inset 3px 0 0 var(--pos)}
table.pick tbody tr{cursor:pointer}
table.pick tbody tr:hover>*{background:var(--soft)}
table.pick tr.cur>*{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.dot.eng{background:var(--eng)}.dot.west{background:var(--west)}
h3 .dot{margin:0}

.ins{padding-left:18px;max-width:75ch;margin:0}
.ins li{margin:6px 0}

.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:14px}
.hgrid label{display:flex;flex-direction:column;gap:5px;font-weight:500}
select,input[type=number]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}

.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.seg button,.quick button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14px}
.seg button.on,.quick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.pills{display:inline-flex;gap:3px;vertical-align:middle}
.pill{width:22px;height:9px;border-radius:3px;border:1px solid var(--muted);overflow:hidden;display:inline-block}
.pill i{display:block;height:100%;background:var(--brass)}

.meter{display:inline-block;width:70px;height:7px;background:var(--soft);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:6px}
.meter i{display:block;height:100%;background:var(--brass)}

.slider{display:flex;flex-direction:column;gap:6px;max-width:460px}
.slider input{width:100%;accent-color:var(--accent)}
.quick{display:flex;gap:6px;margin:10px 0 18px}
.bars{display:flex;flex-direction:column;gap:16px}
.brow{padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.brow.cur{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.bh{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 14px;margin-bottom:8px}
.bh span{color:var(--muted);font-size:13.5px}
.track{position:relative;height:26px;background:var(--soft);border-radius:6px;overflow:hidden}
.track .base{position:absolute;left:0;top:0;bottom:0;background:repeating-linear-gradient(135deg,var(--line) 0 5px,transparent 5px 10px)}
.track .bs{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--accent-ink);border-right:1px solid var(--surface)}
.bs0{background:var(--accent)}.bs1{background:color-mix(in srgb,var(--accent) 72%,var(--surface))}
.track .tgt{position:absolute;top:0;bottom:0;width:2px;background:var(--brass);margin-left:-1px}
.combo{font-size:12.5px;color:var(--muted);margin-top:6px}

.sets{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;background:var(--surface);margin:0;display:flex;flex-direction:column;gap:10px}
legend{font:600 16px var(--serif);padding:0 6px}
.fld{display:grid;grid-template-columns:1fr 96px;gap:10px;align-items:center;font-size:14px}
.fld.chk{grid-template-columns:auto 1fr}
.fld.chk input{width:18px;height:18px;accent-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 16px}
.pgrid .fld{grid-template-columns:1fr 64px}
fieldset.wide{grid-column:1/-1}
table.tset input[type=number]{width:80px}
table.tset input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
table.tset th small{display:block}
.reset{margin-top:16px;background:none;border:1px solid var(--neg);color:var(--neg);border-radius:8px;padding:8px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Trainingscentrum</h1>
  <p>Wat kost het om een paard in Horse Nation vol te trainen, hoeveel klikjes en tijd gaat het kosten, en welke manier van trainen is het waard?</p>
</header>
<section class="picker" aria-label="Trainingsmethode"><h2>Hoe train je?</h2><div id="methods" role="radiogroup"></div></section>
<div id="rpdbar" class="rpd"></div>
<section id="builder" hidden></section>
<section id="summary" aria-live="polite"></section>
<nav id="tabs" role="tablist"></nav>
<main id="view"></main>
</div>
<script>
const PRICES_DEFAULT = {10:25,11:29,12:32,13:36,14:39,15:43,16:46,17:50,18:53,19:57,20:60};
const PRICE_NOTE = {13:'geschat',16:'teruggerekend',18:'teruggerekend',19:'geschat'};
const XP_KNOWN = {10:true,17:true,20:true};
const W = (bars,fee,prize,n)=>({n,bars,fee,prize});
const WEST_LEVELS = [W(2,0,800,'L5'),W(4,75,1500,'L4'),W(5,200,3000,'L3'),W(5,600,5000,'L2'),W(5,750,7500,'L1')];
const DISCS = [
  {id:'dres',name:'Dressuur',group:'eng',icon:'🎀',levels:[W(2,0,800,'BB'),W(3,50,1200,'B'),W(4,100,1750,'L1'),W(5,150,2500,'L2'),W(5,200,3500,'M1'),W(5,300,5000,'M2'),W(5,500,7000,'Z1'),W(5,750,9000,'Z2'),W(5,1000,10500,'ZZ-Licht'),W(5,1250,12000,'ZZ-Zwaar')]},
  {id:'spr',name:'Springen',group:'eng',icon:'🏇',levels:[W(2,0,800,'B'),W(4,75,1500,'L'),W(5,200,3000,'M'),W(5,600,5000,'Z'),W(5,750,7500,'ZZ')]},
  {id:'rei',name:'Reining',group:'west',icon:'🤠',levels:WEST_LEVELS},
  {id:'tra',name:'Trail',group:'west',icon:'🤠',levels:WEST_LEVELS},
  {id:'wp',name:'Western Pleasure',group:'west',icon:'🤠',levels:WEST_LEVELS},
];
const METHODS = [
  {id:'gratis',name:'Zelfstandig rijden',sub:'+4% per klik, gratis'},
  {id:'gezellig',name:'Gezellig lesje',sub:'+6% per klik'},
  {id:'actief',name:'Actieve les',sub:'+8% per klik'},
  {id:'meest',name:'Trainer, snelst',sub:'minste klikjes met de trainers die er zijn'},
  {id:'zuinig',name:'Trainer, goedkoopst',sub:'minste munten met de trainers die er zijn'},
  {id:'eigen',name:'Eigen combo',sub:'stel zelf je klikjes samen'},
];
const FOKBONUS=[
  {ids:['dres','spr'],sdg:[6,6,6]},{ids:['rei','tra','wp'],sdg:[6,6,6]},
  {ids:['dres','rei'],sdg:[5,6,6]},{ids:['dres','tra'],sdg:[6,6,4]},{ids:['dres','wp'],sdg:[6,6,3]},
  {ids:['spr','rei','tra'],sdg:[5,4,6]},{ids:['spr','rei','wp'],sdg:[5,5,6]},{ids:['spr','tra','wp'],sdg:[6,5,6]}];
const STEP_CODES=['z4','g6','a8','t10','t11','t12','t13','t14','t15','t16','t17','t18','t19','t20'];
function stepInfo(code,S){
  const p=+code.slice(1);
  if(code[0]==='z') return {code,p,c:0,xp:S.lessonXP,label:'Rit '+p+'%',kind:'les'};
  if(code[0]==='g') return {code,p,c:+S.priceGezellig,xp:S.lessonXP,label:'Gezellig '+p+'%',kind:'les'};

function fillBar(need,{steps,costFirst}){

function combine(list,S){

function vFokbonus(){
  const from=S.fbFrom==='paard'?S.horse:null, r=fullFor(S.method,from);
  const byId=Object.fromEntries(r.ds.map(x=>[x.d.id,x]));
  const rows=FOKBONUS.map(f=>{const sel=f.ids.map(id=>byId[id]); const tot=combine(sel,S); const done=sel.every(x=>x.levels.length===0); const dots=f.sdg.reduce((a,b)=>a+b,0);
    return {f,sel,tot,done,dots,name:f.ids.map(id=>DISCS.find(d=>d.id===id).name).join(' + ')};});
  rows.forEach(a=>{a.better=rows.find(b=>b!==a&&!b.done&&b.tot.total<=a.tot.total&&b.f.sdg.every((v,i)=>v>=a.f.sdg[i])&&(b.tot.total<a.tot.total||b.f.sdg.some((v,i)=>v>a.f.sdg[i])));});
  const open=rows.filter(x=>!x.done), full=open.filter(x=>x.dots===18).sort((a,b)=>a.tot.total-b.tot.total), cheap=[...open].sort((a,b)=>a.tot.total-b.tot.total)[0];

function candidatesAll(from){
  const out={full:[],eng:[],west:[],fok:[],fok18:[]};
  for(const m of METHODS){
    const r=fullFor(m.id,from), byId=Object.fromEntries(r.ds.map(x=>[x.d.id,x]));
    const pack=(x,extra={})=>({method:m,total:x.total,clicks:x.clicks,minutes:x.minutes,days:x.days,xp:x.xp,...extra});
    out.full.push(pack(r.all)); out.eng.push(pack(r.eng)); out.west.push(pack(r.west));
    for(const f of FOKBONUS){const sel=f.ids.map(id=>byId[id]); const tot=combine(sel,S); const name=f.ids.map(id=>DISCS.find(d=>d.id===id).name).join(' + ');
      const dots=f.sdg.reduce((a,b)=>a+b,0), done=sel.every(x=>x.levels.length===0);

}

  let mine; if(restDone) mine=dresDone?'Klaar':'Dressuur'; else if(S.sgOpt==='simpel') mine='Opbouw'; else mine=h.dres===0?'Starters':h.dres<=2?'Basis':'Allround';
  const anyAhead=!restDone&&S.sgOpt!=='simpel'&&h.dres>=3;
  const tOff=m=>`${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  const cellHTML=(d,i)=>{const L=d.levels[i]; if(!L) return '<td></td>'; const isTop=i===d.levels.length-1; return `<td class="lc${isTop?' topl':''}"><b>${L.n}</b><span class="pills">${Array.from({length:L.bars},()=>'<span class="pill"></span>').join('')}</span><small>+${tOff(slotOffset(d.id,i))}${isTop?', top':''}</small></td>`;};
  const colors=['g1','g2','g3','g4'];
  const trained=G.filter(g=>g.to!==null);
  return `<h2>Stalgroepen</h2>
  <p class="intro">Bij allround trainen promoveren de disciplines van een paard ongeveer tegelijk. Een paard zit dus steeds in al zijn disciplines op dezelfde laag van het wedstrijdschema, en het Dressuur-niveau vertelt je in welke groep het hoort. Kies hoe fijn je wilt indelen.</p>
  <div class="seg"><button type="button" data-sgopt="simpel" class="${S.sgOpt==='simpel'?'on':''}" aria-pressed="${S.sgOpt==='simpel'}">Simpel, 3 groepen</button><button type="button" data-sgopt="laag" class="${S.sgOpt!=='simpel'?'on':''}" aria-pressed="${S.sgOpt!=='simpel'}">Gestroomlijnd, per laag</button></div>
  <p class="note">${S.sgOpt==='simpel'?'Je verplaatst een paard maar twee keer. In Opbouw zitten de eerste dagen wel verschillende aantallen balkjes door elkaar.':'In Starters, Allround en Dressuur heeft elk paard overal evenveel balkjes, dus elke ronde is hetzelfde. Alleen in Basis wisselt het nog. Je verplaatst een paard wel vier keer.'} Duur berekend voor een nieuw paard met ${mName(S.method).toLowerCase()}, ${S.racesPerDay} van 4 wedstrijden per dag.</p>
  <div class="phase">${trained.map((g,i)=>`<span class="ph ${colors[i]}" style="width:${w(g.to-g.from)}%" title="${g.n}: ${dur(g.to-g.from)}"><b>${g.n}</b><small>${dur(g.to-g.from)}</small></span>`).join('')}</div>
  <div class="phaxis"><span>start</span>${trained.slice(0,-1).map(g=>`<span style="left:${w(g.to-P.t0)}%">${dur(g.to-P.t0)}</span>`).join('')}<span style="left:100%">${dur(span)}</span></div>

  <div class="tw"><table class="sgt"><thead><tr><th>Groep</th><th><span class="dot eng"></span>Dressuur</th><th><span class="dot eng"></span>Springen</th><th><span class="dot west"></span>Western</th><th>Balkjes</th><th>Duur</th><th>Klikjes per dag</th><th class="lft">Doorschuiven als</th></tr></thead><tbody>
  ${G.map((g,i)=>`<tr class="${g.n===mine?'cur':''}"><th scope="row"><span class="gnum ${colors[i]||'g5'}">${i+1}</span> ${g.n}<small>ook: ${SG_ALT[g.n]}</small></th><td>${g.dres}</td><td>${g.spr}</td><td>${g.west}</td><td>${g.bars}</td><td>${g.to===null?'–':dur(g.to-g.from)}</td><td>${g.to===null||g.to<=g.from?'–':nf(cnt(g.from,g.to)/((g.to-g.from)/1440))}</td><td class="lft">${g.move||'Klaar om mee te fokken'}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="note">Western betekent Reining, Trail en Western Pleasure samen; die lopen gelijk op. Klikjes per dag gaat over één paard.</p>

  <h3>Jouw paard</h3>
  <p class="mine">Hoort in groep <b>${mine}</b>.${anyAhead?' Dressuur loopt voor op Springen of Western; het paard blijft in Allround tot die ook klaar zijn.':''} <span class="muted2">Gebaseerd op de niveaus onder Mijn paard.</span></p>

  <h3>Tips</h3>
  <ul class="ins">
    <li>Start nieuwe paarden in lichtingen tegelijk. Dan zitten alle paarden in een groep op hetzelfde niveau en hebben ze evenveel balkjes.</li>
    <li>Een nieuwe lichting ongeveer om de ${dur(P.opEnd-P.t0)} houdt de drukke groepen vóór Dressuur overzichtelijk.</li>
    <li>De groepen vóór Dressuur kosten per paard ${nf(cnt(P.t0,P.opEnd)/((P.opEnd-P.t0)/1440))} klikjes per dag, de Dressuur-groep ${nf(cnt(P.opEnd,P.dresEnd+1)/((P.dresEnd-P.opEnd)/1440))}. Hoeveel paarden je tegelijk aankunt, hangt vooral af van hoeveel er vóór Dressuur zitten.</li>
  </ul>

  <h3>Vaste klikjes</h3>
  <div class="tw"><table class="narrow"><thead><tr><th>Balkje staat op</th><th class="lft">Wanneer</th><th>Klikjes</th></tr></thead><tbody>
    <tr><th scope="row">50%</th><td class="lft">Na elke wedstrijd, verreweg het vaakst</td><td>${fbx(T-50)}</td></tr>
    <tr><th scope="row">25%</th><td class="lft">Bestaande balkjes na promoveren</td><td>${fbx(T-25)}</td></tr>
    <tr><th scope="row">Leeg</th><td class="lft">Nieuwe balkjes na promoveren, en het eerste niveau</td><td>${fbx(T)}</td></tr>
  </tbody></table></div>

  <h3>Werkvolgorde: het schema in lagen</h3>
  <p class="intro">Binnen een wedstrijdblok rijden de lagen na elkaar: de eerste vijf lagen elk in een blokje van 25 minuten, daarna alleen nog Dressuur. Train je binnen een groep van links naar rechts, dan train je in de volgorde waarin de wedstrijden starten.</p>
  <div class="tw"><table class="lagen"><thead><tr><th>Laag</th>${DISCS.map(d=>`<th><span class="dot ${d.group}"></span>${d.name}</th>`).join('')}</tr></thead><tbody>
    ${[0,1,2,3,4].map(i=>`<tr><th scope="row">${i+1}</th>${DISCS.map(d=>cellHTML(d,i)).join('')}</tr>`).join('')}
    ${[5,6,7,8,9].map(i=>`<tr><th scope="row">${i+1}</th>${cellHTML(DISCS[0],i)}<td colspan="4"></td></tr>`).join('')}
  </tbody></table></div>
  <p class="note">De tijd is hoe lang na de start van het blok de wedstrijd begint. Het hoogste niveau hoef je niet meer te trainen.</p>`;
}
const VIEWS={beste:['Beste keus',vBeste],overzicht:['Overzicht',vOverzicht],paard:['Mijn paard',vPaard],fokbonus:['Fokbonus',vFokbonus],planning:['Planning',vPlanning],stalgroepen:['Stalgroepen',vStalgroepen],niveaus:['Per niveau',vNiveaus],methoden:['Methoden',vMethoden],wedstrijden:['Wedstrijden',vWedstrijden],balkjes:['Balkjes',vBalkjes],aannames:['Aannames',vAannames]};
function renderTabs(){$('#tabs').innerHTML=Object.entries(VIEWS).map(([id,[n]])=>`<button type="button" role="tab" aria-selected="${S.tab===id}" data-tab="${id}" class="${S.tab===id?'on':''}">${n}</button>`).join('');}
function render(keepFocus){
  const a=document.activeElement, key=a&&(a.dataset.set||a.dataset.price||a.dataset.txp||a.dataset.avail||a.dataset.pl), kattr=a&&(a.dataset.set?'set':a.dataset.price?'price':a.dataset.txp?'txp':a.dataset.pl?'pl':'avail'), sel=a&&a.selectionStart;
  renderMethods(); renderRpd(); renderBuilder(); renderSummary(); renderTabs(); $('#view').innerHTML=VIEWS[S.tab][1]();
  if(keepFocus&&key){const el=document.querySelector(`[data-${kattr}="${key}"]`); if(el){el.focus(); try{if(el.type!=='range'&&sel!=null)el.setSelectionRange(sel,sel);}catch(e){}}}
  save();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-sgopt],[data-rpd],[data-planfrom],[data-plansel],[data-ord],[data-builder],[data-bestfrom],[data-fbfrom],[data-method],[data-tab],[data-ldisc],[data-bar],[data-reset],[data-add],[data-rm],[data-clr]'); if(!t) return;
  if(t.dataset.sgopt){S.sgOpt=t.dataset.sgopt;}
  else if(t.dataset.rpd){S.racesPerDay=+t.dataset.rpd;}
  else if(t.dataset.planfrom){S.planFrom=t.dataset.planfrom;}
  else if(t.dataset.plansel){S.planSel=t.dataset.plansel;}
  else if(t.dataset.ord){const [i,dir]=t.dataset.ord.split(':').map(Number); const j=i+dir; const o=[...S.planOrder]; [o[i],o[j]]=[o[j],o[i]]; S.planOrder=o;}
  else if(t.dataset.builder){S.builderOpen=t.dataset.builder==='open';}
  else if(t.dataset.bestfrom){S.bestFrom=t.dataset.bestfrom;}
  else if(t.dataset.fbfrom){S.fbFrom=t.dataset.fbfrom;}
  else if(t.dataset.add){const [k,c]=t.dataset.add.split(':'); (S.custom[k]=S.custom[k]||[]).push(c); if(S.custom[k].length>30) S.custom[k].pop();}
  else if(t.dataset.rm){const [k,i]=t.dataset.rm.split(':'); S.custom[k].splice(+i,1);}
  else if(t.dataset.clr!==undefined){S.custom[t.dataset.clr]=[];}
  else if(t.dataset.method) S.method=t.dataset.method;
  else if(t.dataset.tab) S.tab=t.dataset.tab;
  else if(t.dataset.ldisc) S.levelDisc=t.dataset.ldisc;
  else if(t.dataset.bar!==undefined) S.barStart=+t.dataset.bar;
  else if(t.hasAttribute('data-reset')){ if(confirm('Alle aannames terugzetten naar de standaardwaarden?')){const keep={tab:S.tab,horse:S.horse,custom:S.custom,method:S.method}; S={...JSON.parse(JSON.stringify(DEFAULTS)),...keep};} }
  render();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tr[data-method]')){S.method=e.target.dataset.method;render();} if(e.key==='Enter'&&e.target.matches('tr[data-plansel]')){S.planSel=e.target.dataset.plansel;render();}});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.set==='barStart'){ S.barStart=+t.value; $('#barVal').textContent=S.barStart+'%'; $('#barsOut').innerHTML=barsHTML(); document.querySelectorAll('[data-bar]').forEach(b=>b.classList.toggle('on',+b.dataset.bar===S.barStart)); save(); return; }
  if(t.dataset.set){ const k=t.dataset.set; if(t.type==='checkbox') S[k]=t.checked; else { const v=parseFloat(t.value); if(isNaN(v)||v<0) return;
      if(['avgEng','avgSpr','avgWest','ptsEng','ptsWest','racesPerDay','activeHours'].includes(k)&&v<=0) return;
      if(k==='target'&&(v<50||v>100)) return;
      S[k]=v; if(k==='target') S.barStart=Math.min(S.barStart,v); } render(true); }
  else if(t.dataset.price){ const v=parseFloat(t.value); if(isNaN(v)) return; S.prices[t.dataset.price]=v; render(true); }
  else if(t.dataset.txp){ const v=parseFloat(t.value); if(isNaN(v)||v<0) return; S.trainerXPs[t.dataset.txp]=v; render(true); }
  else if(t.dataset.pl){ const [g,i]=t.dataset.pl.split(':'); const v=parseFloat(t.value); if(isNaN(v)||v<0||v>100) return; S.pl={...S.pl,[g]:S.pl[g].map((x,j)=>j===+i?v:x)}; render(true); }
  else if(t.dataset.avail){ S.avail[t.dataset.avail]=t.checked; render(true); }
});
document.addEventListener('change',e=>{ if(e.target.dataset.horse){ S.horse[e.target.dataset.horse]=+e.target.value; render(); } });
render();
</script></body></html>
